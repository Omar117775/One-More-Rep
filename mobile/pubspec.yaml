name: mobile
description: "One More Rep - Premium Fitness Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  flutter_localizations:
    sdk: flutter
  intl: any
  lottie: ^3.6.1
  rive: ^0.14.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/static/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/static/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/static/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/static/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/static/Manrope-ExtraBold.ttf
          weight: 800
